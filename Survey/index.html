<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Stress and Motivation Pen Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0e9; --surface:#fbfaf6; --text:#1c1b19; --muted:#6a665d; --line:#ddd9cd;
  --ink:#f76f53;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#151412;--surface:#201f1c;--text:#f2f0e9;--muted:#a39e92;--line:#36342f}
}
:root[data-theme="dark"]{--bg:#151412;--surface:#201f1c;--text:#f2f0e9;--muted:#a39e92;--line:#36342f}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.3;background:var(--ink);transition:background 1s;animation:float 16s ease-in-out infinite alternate;pointer-events:none}
.b1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax}
.b2{width:38vmax;height:38vmax;right:-12vmax;bottom:-14vmax;animation-delay:-6s;opacity:.22}
@keyframes float{to{transform:translate(6vmax,4vmax) scale(1.12)}}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ink);z-index:11;transition:width .5s,background .5s}
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:20px;padding:10px 22px;border-radius:99px;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(18px);border:1px solid var(--line);font-size:14px;white-space:nowrap}
nav b{font-weight:700;letter-spacing:-.02em}
nav span{color:var(--muted)}
main{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:110px 20px 70px}
.step{width:100%;max-width:680px;transition:opacity .45s,filter .45s,transform .45s}
.step.hide{opacity:0;filter:blur(12px);transform:translateY(14px)}
.eyebrow{font-family:Caveat,"Segoe Script","Bradley Hand",cursive;font-weight:700;font-size:28px;color:var(--ink);margin-bottom:6px;transition:color .5s}
h1{font-size:clamp(40px,8vw,84px);font-weight:600;letter-spacing:-.05em;line-height:1}
h2{font-size:clamp(28px,4.6vw,46px);font-weight:600;letter-spacing:-.04em;line-height:1.08}
.lead{color:var(--muted);font-size:clamp(16px,2vw,20px);line-height:1.5;margin-top:18px}
mark{color:inherit;background:linear-gradient(transparent 58%,color-mix(in srgb,var(--ink) 42%,transparent) 58%);padding:0 .12em;margin:0 -.12em;border-radius:4px}
.curl{font-family:Caveat,"Segoe Script",cursive;font-style:normal;font-weight:700;color:var(--ink);font-size:1.18em}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:99px;padding:14px 28px;background:var(--ink);color:#fff;cursor:pointer;transition:transform .2s,opacity .3s,background .5s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.nav{display:flex;gap:12px;margin-top:34px;align-items:center}
.nav .sp{flex:1}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.opts.wrap{flex-direction:row;flex-wrap:wrap}
.opt{font:inherit;font-size:17px;font-weight:500;text-align:left;padding:15px 20px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:all .25s}
.opt:hover{border-color:var(--ink);transform:translateX(3px)}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.opts.wrap .opt{padding:12px 20px;border-radius:99px}
.opts.wrap .opt:hover{transform:translateY(-2px)}
.scale{display:flex;gap:10px;margin-top:30px}
.scale .opt{flex:1;aspect-ratio:1;max-width:84px;display:grid;place-items:center;border-radius:50%;font-size:22px;font-weight:600;text-align:center;padding:0}
.scale .opt:hover{transform:translateY(-3px)}
.ends{display:flex;justify-content:space-between;margin-top:14px;font-size:14px;color:var(--muted);max-width:480px}
.field{width:100%;margin-top:28px;font:inherit;font-size:clamp(22px,3.4vw,32px);padding:10px 2px;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--text);outline:none;transition:border-color .3s}
.field:focus{border-color:var(--ink)}
.other{margin-top:14px;font-size:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:30px;margin-top:28px}
.foot{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:var(--muted);z-index:2}
.foot button{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
@media (max-width:600px){.scale{gap:6px}.scale .opt{font-size:18px}nav span{display:none}}
@media (prefers-reduced-motion:reduce){.blob{animation:none}.step{transition:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div id="bar"></div>
<nav><a href="/" style="color:inherit;text-decoration:none"><b>One Pen</b></a><span>Student survey</span></nav>
<main><div id="app" class="step"></div></main>
<div class="foot" id="foot"></div>

<script>
(function(){
  var Q=[
    {id:'name',t:'text',q:'What is your <mark>name</mark>?'},
    {id:'year',t:'single',q:'What <mark>year</mark> are you in?',o:['Year 7','Year 8','Year 9','Year 10','Year 11','Year 12']},
    {id:'stressFreq',t:'scale',q:'How often do you feel <mark>anxious or stressed</mark> before exams?',lo:'Never',hi:'Always'},
    {id:'stressImpact',t:'scale',q:'How much does exam stress <mark>affect your performance</mark>?',lo:'Never',hi:'Always'},
    {id:'coping',t:'multi',q:'What do you currently do to <mark>cope</mark> with exam stress?',o:['Nothing','Listening to Music','Breathing Exercises','Talk to Friends or Family','Fidget Items','Study More','Ask people around you for Help or Advice']},
    {id:'calmStationery',t:'single',q:'Do you use stationery that makes you feel <mark>motivated or calm</mark>?',o:['Yes','No','Never thought of it']},
    {id:'wantPen',t:'ynm',q:'Would you like a pen with <mark>motivational quotes</mark> or with <mark>stress-relief features</mark>?'},
    {id:'favPen',t:'ynm',q:'Do you have a <mark>favourite pen</mark> or prefer a sort of pen?'},
    {id:'customPens',t:'ynm',q:'Do you like <mark>customisable</mark> pens?'},
    {id:'annoyed',t:'ynm',q:'Do you get annoyed when you don’t have a pen you’re <mark>used to</mark>?'},
    {id:'usedToy',t:'ynm',q:'Have you ever used a stress ball or some sort of <mark>stress relief toy</mark> such as a Nee-Doh?'},
    {id:'toyHelps',t:'ynm',q:'Do you think a stress relief toy will help you <mark>cope with exam stress</mark>?'},
    {id:'quotesInspire',t:'ynm',q:'Do <mark>motivational quotes</mark> inspire you?'},
    {id:'quotesHelp',t:'ynm',q:'Do you think motivational quotes will help you <mark>cope with exam stress</mark>?'},
    {id:'gripFocus',t:'ynm',q:'Do you think a <mark>stress relief pen grip</mark> will help you focus during tests?'},
    {id:'quotePenCalm',t:'ynm',q:'Do you think a pen with motivational quotes will make you <mark>calmer</mark> during a test?'}
  ];
  var INKS=['#f76f53','#3b82f6','#14b8a6','#8b5cf6','#f08a24'];
  var app=document.getElementById('app'),bar=document.getElementById('bar'),foot=document.getElementById('foot');
  var A={},i=-1,otherOn=false,otherText='',busy=false,saved=null,rid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  try{var d=JSON.parse(localStorage.getItem('pen-survey-draft')||'null');if(d&&d.A){A=d.A;i=Math.min(d.i||-1,Q.length-1)}}catch(e){}
  function draft(){try{localStorage.setItem('pen-survey-draft',JSON.stringify({A:A,i:i}))}catch(e){}}
  function clearDraft(){try{localStorage.removeItem('pen-survey-draft')}catch(e){}}

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function answered(q){
    var v=A[q.id];
    if(q.t==='multi')return Array.isArray(v)&&v.length>0&&(!v.includes('Other')||!!(A.copingOther||'').trim());
    if(q.t==='text')return !!(v||'').trim();
    return v!==undefined&&v!=='';
  }

  function swap(html,after){
    app.classList.add('hide');
    setTimeout(function(){
      app.innerHTML=html;after&&after();
      requestAnimationFrame(function(){app.classList.remove('hide')});
    },app.innerHTML?420:0);
  }

  function setInk(){document.documentElement.style.setProperty('--ink',INKS[(Math.max(i,0))%INKS.length])}

  function intro(){
    i=-1;setInk();bar.style.width='0';foot.textContent='';
    swap('<div class="eyebrow">A calmer pen</div><h1>Exam stress &amp; <mark>motivation</mark></h1>'+
      '<p class="lead">Help us design a pen for students who want less stress and more focus. It takes about two minutes, and all '+Q.length+' questions are required.</p>'+
      '<div class="nav"><button class="btn" id="go">'+(Object.keys(A).length?'Continue':'Start')+'</button>'+
      (Object.keys(A).length?'<button class="btn ghost" id="reset">Start over</button>':'')+'</div>',
      function(){
        document.getElementById('go').onclick=function(){var k=0;while(k<Q.length-1&&answered(Q[k]))k++;show(k)};
        var r=document.getElementById('reset');if(r)r.onclick=function(){A={};clearDraft();intro()};
      });
  }

  function show(n){
    i=n;setInk();draft();otherOn=(A.coping||[]).includes('Other');
    var q=Q[n],h='<div class="eyebrow">Question '+(n+1)+' of '+Q.length+'</div><h2>'+q.q+'</h2>';
    if(q.t==='text')h+='<input class="field" id="f" type="text" maxlength="80" autocomplete="given-name" placeholder="Your answer" value="'+esc(A[q.id]||'')+'">';
    else if(q.t==='scale'){
      h+='<div class="scale" role="group">';
      for(var s=1;s<=5;s++)h+='<button class="opt" data-v="'+s+'" aria-pressed="'+(A[q.id]===s)+'">'+s+'</button>';
      h+='</div><div class="ends"><span>'+q.lo+'</span><span>'+q.hi+'</span></div>';
    }else{
      var opts=q.t==='ynm'?['Yes','No','Maybe']:q.o.slice();
      if(q.t==='multi')opts.push('Other');
      h+='<div class="opts'+(q.t==='multi'?' wrap':'')+'" role="group">';
      opts.forEach(function(o){
        var on=q.t==='multi'?(A[q.id]||[]).includes(o):A[q.id]===o;
        h+='<button class="opt" data-v="'+esc(o)+'" aria-pressed="'+on+'">'+(o==='Other'?'Other…':esc(o))+'</button>';
      });
      h+='</div>';
      if(q.t==='multi')h+='<input class="field other" id="oth" type="text" maxlength="120" placeholder="Tell us what you do" style="display:'+(otherOn?'block':'none')+'" value="'+esc(A.copingOther||'')+'"><div class="hint">Choose all that apply.</div>';
    }
    h+='<div class="nav">'+(n>0?'<button class="btn ghost" id="back">Back</button>':'')+'<span class="sp"></span><button class="btn" id="next">'+(n===Q.length-1?'Submit':'Next')+'</button></div><div class="hint" id="err" role="alert" style="color:var(--ink)"></div><input id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">';
    bar.style.width=((n)/Q.length*100)+'%';
    swap(h,function(){bind(q,n)});
  }

  function bind(q,n){
    var next=document.getElementById('next'),back=document.getElementById('back');
    function sync(){next.disabled=!answered(q)||busy}
    sync();
    if(back)back.onclick=function(){show(n-1)};
    next.onclick=function(){go(n)};
    var f=document.getElementById('f');
    if(f){f.focus();f.oninput=function(){A[q.id]=f.value;draft();sync()};f.onkeydown=function(e){if(e.key==='Enter'&&answered(q))go(n)}}
    var oth=document.getElementById('oth');
    if(oth)oth.oninput=function(){A.copingOther=oth.value;draft();sync()};
    [].forEach.call(app.querySelectorAll('.opt'),function(b){
      b.onclick=function(){
        var raw=b.getAttribute('data-v'),v=q.t==='scale'?+raw:raw;
        if(q.t==='multi'){
          var arr=A[q.id]||[],k=arr.indexOf(v);
          if(k>-1)arr.splice(k,1);else arr.push(v);
          A[q.id]=arr;b.setAttribute('aria-pressed',k===-1);
          if(v==='Other'){oth.style.display=k===-1?'block':'none';if(k===-1)oth.focus()}
          draft();sync();
        }else{
          A[q.id]=v;draft();
          [].forEach.call(app.querySelectorAll('.opt'),function(x){x.setAttribute('aria-pressed',x===b)});
          sync();
          if(n<Q.length-1)setTimeout(function(){if(i===n)go(n)},380);
        }
      };
    });
  }

  function go(n){if(!answered(Q[n]))return;if(n===Q.length-1)submit();else show(n+1)}

  function record(){
    var r={rid:rid,submittedAt:new Date().toISOString()};
    Q.forEach(function(q){r[q.id]=A[q.id]});
    r.copingOther=A.copingOther||'';
    return r;
  }

  async function submit(){
    if(busy)return;busy=true;
    var btn=document.getElementById('next'),err=document.getElementById('err');
    if(err)err.textContent='';
    if(btn){btn.disabled=true;btn.textContent='Sending…'}
    try{
      var rec=record(),hp=document.getElementById('hp');
      rec.website=hp?hp.value:'';
      var res=await fetch('/api/survey',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)});
      if(!res.ok){var j={};try{j=await res.json()}catch(e){}throw new Error(j.error||('HTTP '+res.status))}
      busy=false;clearDraft();bar.style.width='100%';i=Q.length;setInk();done();
    }catch(e){
      busy=false;
      if(btn){btn.disabled=false;btn.textContent='Submit'}
      if(err)err.textContent='We couldn’t send your answers ('+e.message+'). Your answers are kept, so please try again.';
    }
  }

  function done(){
    swap('<div class="eyebrow">All done</div><h1>Thank <em class="curl" style="font-size:1.1em">you</em>.</h1>'+
      '<p class="lead">Your answers have been sent. Every response helps us make a <mark>calmer pen</mark> for students.</p>');
  }

  if(i>=0&&Object.keys(A).length)intro();else intro();
})();
</script>
</body>
</html>
