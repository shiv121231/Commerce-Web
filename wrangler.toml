# "name" must match your Worker's name exactly (Cloudflare dashboard > your project > Settings)
name = "commerce-web"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./Survey"        # the folder that holds your site (index.html etc.)
binding = "ASSETS"
run_worker_first = ["/api/*"] # only /api/* runs code, everything else is served as static files

[[d1_databases]]
binding = "DB"
database_name = "onepen-survey"
database_id = "PASTE-ID-FROM-wrangler-d1-create"
